<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>漢字の塔（試作3）</title>
<style>
:root{--bg:#14122b;--panel:#221f45;--panel2:#2d2960;--ink:#f4f1ff;--sub:#b3add9;--gold:#ffd166;--good:#7be495;--bad:#ff7b8a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;border-radius:14px;padding:12px 18px;background:var(--panel2);font-weight:700;touch-action:manipulation}
button:disabled{opacity:.35}
button.primary{background:linear-gradient(#ffd166,#f4a534);color:#3a2500}
button.ghost{background:transparent;border:1px solid #514b8f;color:var(--sub);padding:8px 12px;font-weight:500}
.kyo{font-family:"YuKyokasho","Yu Kyokasho","UD Digi Kyokasho N-R","Hiragino Mincho ProN",serif}
.screen{display:none;height:100dvh;padding:calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left))}
.screen.active{display:flex;flex-direction:column}
.proto{font-size:12px;color:#3a2500;background:var(--gold);border-radius:99px;padding:2px 10px;font-weight:700;margin-left:8px;vertical-align:middle}

/* ホーム */
#home{align-items:center;overflow:auto;gap:10px}
#home h1{margin:6px 0 0;font-size:26px}
.floor{width:min(460px,100%);background:linear-gradient(#2b2760,#1b1838);border:2px solid #3b3680;border-radius:22px;padding:14px;text-align:center}
.floor .num{font-size:46px;font-weight:900;color:var(--gold);line-height:1.1}
.floor .hero{font-size:44px;animation:bob 1s ease-in-out infinite;display:inline-block}
@keyframes bob{50%{transform:translateY(-6px)}}
.meter{position:relative;height:10px;background:#120f2a;border-radius:99px;overflow:hidden;margin-top:8px}.meter i{position:absolute;left:0;top:0;bottom:0;background:#6ec6ff}.meter i.gold{background:var(--gold)}
.today{width:min(460px,100%);display:flex;flex-direction:column;gap:8px}
.trow{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:16px;padding:8px 14px}
.trow .em{font-size:32px}.trow small{display:block;color:var(--sub)}
.tag{margin-left:auto;font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px;background:#3b3680}
.tag.new{background:var(--gold);color:#3a2500}
#go{font-size:22px;padding:14px 40px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.credit{font-size:11px;color:#8d87b8;text-align:center;margin:4px 0}.credit a{color:inherit}

/* 重ねて出すカード */
.overlay{position:fixed;inset:0;background:rgba(10,8,30,.88);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.overlay.on{display:flex}
.card{background:var(--panel);border:2px solid #4c4699;border-radius:24px;padding:18px 20px;width:min(640px,100%);max-height:100%;overflow:auto;text-align:center}
.card h2{margin:0 0 6px;font-size:22px}.card p{margin:6px 0;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin:10px 0}
.kcard{background:var(--panel2);border-radius:16px;padding:8px;text-align:center}
.kcard svg{width:100%;background:#fff;border-radius:10px;display:block}
.kcard.locked svg{background:#3b3766}
.kcard small{display:block;color:var(--sub);margin-top:4px;line-height:1.5;font-size:12px}
.kcard .stars{color:var(--gold);letter-spacing:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{font-size:14px;font-weight:700;padding:3px 12px;border-radius:99px;color:#1b1838}
.big{font-size:44px;letter-spacing:6px}

/* れんしゅう */
#quest{gap:8px}
.bar{display:flex;align-items:center;gap:10px;flex:none}
.enemy{display:flex;align-items:center;gap:8px;margin-left:auto;background:var(--panel);border-radius:14px;padding:4px 12px}
.sprite{font-size:34px;line-height:1}.sprite.hit{animation:hit .3s}.sprite.dead{animation:dead .7s forwards}
@keyframes hit{30%{transform:translateX(8px) rotate(10deg);filter:brightness(2.2)}60%{transform:translateX(-6px)}}
@keyframes dead{to{transform:translateY(20px) rotate(40deg) scale(.2);opacity:0}}
.pips{display:flex;gap:4px}.pips i{width:16px;height:10px;border-radius:5px;background:#ff7b8a}.pips i.off{background:#3b3766}
.arena{flex:1;min-height:0;display:grid;gap:10px;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
.side{display:flex;flex-direction:column;gap:8px;min-width:0}
.steplabel{font-weight:800;color:var(--gold);font-size:15px}
.question{background:var(--panel);border-radius:16px;padding:8px 14px;font-size:24px;line-height:1.5}
.question b{color:#1b1838;background:var(--gold);border-radius:8px;padding:0 6px;margin:0 2px}
.msg{min-height:2.9em;background:#1b1838;border-radius:14px;padding:8px 12px;font-size:17px;line-height:1.4;border-left:6px solid #514b8f}
.msg.good{border-color:var(--good)}.msg.bad{border-color:var(--bad)}
.tray{display:flex;gap:8px;flex-wrap:wrap}
.tile{width:76px;height:76px;padding:4px;background:#fffdf6;border-radius:14px;border:4px solid transparent}
.tile svg{width:100%;height:100%;display:block;pointer-events:none}
.tile.sel{border-color:var(--gold);transform:translateY(-4px)}
.tile.used{visibility:hidden}.tile.no{animation:shake .25s;opacity:.3}
.opt{font-size:46px;width:84px;height:84px;padding:0;background:#fffdf6;color:#1b1838;border-radius:16px}
.opt.no{animation:shake .25s;opacity:.3}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.board{min-height:0;min-width:0;display:flex;align-items:center;justify-content:center}
#stage{background:#fffdf6;border-radius:18px;touch-action:none;display:block;box-shadow:0 0 0 4px #4c4699}
#stage.shake{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.slot{fill:rgba(76,70,153,.06);stroke:#8d87b8;stroke-width:.8;stroke-dasharray:3 2}
.slot.hot{stroke:#f4a534;stroke-width:1.6;fill:rgba(255,209,102,.25)}
.banner{position:fixed;left:50%;top:15%;transform:translate(-50%,-50%) scale(.6);background:var(--gold);color:#3a2500;font-weight:900;font-size:24px;padding:10px 24px;border-radius:99px;opacity:0;pointer-events:none;z-index:15;white-space:nowrap;transition:.2s}
.banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
@media (orientation:landscape){.arena{grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(280px,40%) minmax(0,1fr)}}
</style>
</head>
<body>

<section class="screen active" id="home">
  <h1>🗼 漢字の塔<span class="proto">試作3</span></h1>
  <div class="floor"><div class="hero">🧙</div><div class="num" id="floorNum"></div><div id="floorText"></div></div>
  <div id="todayHead" style="color:var(--sub);font-size:14px"></div>
  <div class="today" id="today"></div>
  <button class="primary" id="go">つぎの かいへ ▲</button>
  <div class="row"><button class="ghost" id="openBook">📖 漢字ずかん</button><button class="ghost" id="openParent">📋 保護者用</button></div>
  <p class="credit">書き順・お手本の字形：<a href="https://kanjivg.tagaini.net/" target="_blank" rel="noopener">KanjiVG</a>（© Ulrich Apel and contributors、CC BY-SA 3.0）</p>
</section>

<section class="screen" id="quest">
  <div class="bar"><button class="ghost" id="retreat">‹ やめる</button><div class="steplabel" id="stepLabel"></div>
    <div class="enemy"><div class="sprite" id="sprite"></div><div><div id="ename" style="font-weight:800;font-size:13px"></div><div class="pips" id="pips"></div></div></div></div>
  <div class="arena">
    <div class="side">
      <div class="question kyo" id="question"></div>
      <div class="msg" id="msg"></div>
      <div class="tray" id="tray"></div>
      <div class="actions" id="actions"></div>
    </div>
    <div class="board" id="board"><svg id="stage" viewBox="0 0 109 109" aria-label="漢字の場所"></svg></div>
  </div>
</section>

<div class="banner" id="banner"></div>

<div class="overlay" id="winOv"><div class="card">
  <h2 id="winTitle"></h2><div class="big" id="winStars"></div><p id="winText"></p><div class="chips" id="winChips"></div>
  <div class="row" style="margin-top:12px"><button class="primary" id="winOk">つぎへ</button></div>
</div></div>

<div class="overlay" id="bookOv"><div class="card">
  <h2>📖 漢字ずかん</h2><p>たおした 漢字は なかまに なる。日を あけて また たたかうと ★が ふえるよ。</p>
  <div class="grid" id="bookGrid"></div><p>あつめた 部品</p><div class="chips" id="bookParts"></div>
  <div class="row" style="margin-top:12px"><button class="primary" id="bookClose">とじる</button></div>
</div></div>

<div class="overlay" id="parentOv"><div class="card">
  <h2>📋 保護者用</h2>
  <p>「思い出して書く」で さいごに書いた字（黒）と、そのときの自己判定です。うすい赤は お手本。</p>
  <div class="grid" id="parentGrid"></div>
  <p><label>テストの日 <input type="date" id="testDate" style="font:inherit;padding:4px 8px;border-radius:8px;border:0"></label></p>
  <p id="parentDay"></p>
  <div class="row"><button class="ghost" id="skipDay">試用：日を 1日 進める</button><button class="ghost" id="resetAll">記録を 消す</button><button class="primary" id="parentClose">とじる</button></div>
</div></div>

<script src="../chapter4/kanji-strokes.js"></script>
<script src="../chapter4/stroke-trace.js"></script>
<script src="tower-data.js"></script>
<script src="tower-core.js"></script>
<script>
"use strict";
const C=TowerCore,ST=StrokeTrace,STROKES=KANJI_STROKES;
const $=id=>document.getElementById(id);
const COLORS=['#f08a00','#1e88e5','#43a047'],CHIP=['#ffb347','#6ec6ff','#b9f18c'];
const ORDER=C.KANJI.map(e=>e.k);
const MODELS={},BYK={};for(const e of C.KANJI){MODELS[e.k]=C.prep(STROKES[e.k]);BYK[e.k]=e}
const entryOf=k=>BYK[k];
const STEP_NAME={meet:'であう',pick:'どの字？',build:'くみたて',order:'書きじゅん',trace:'なぞる',recall:'思い出して 書く'};

/* ---------- 保存（試作専用のキー。第1〜4章の記録にはさわらない） ---------- */
const SAVE_KEY='kanjiTowerProto_v3';
const blank=()=>({recs:{},floor:0,dayOffset:0,testDay:0,ink:{}});
function loadSave(){try{const s=Object.assign(blank(),JSON.parse(localStorage.getItem(SAVE_KEY)||'{}'));for(const f of['recs','ink'])if(!s[f]||typeof s[f]!=='object')s[f]={};return s}catch(e){return blank()}}
let save=loadSave();
function store(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save))}catch(e){}}
const today=()=>C.dayKey(new Date(),save.dayOffset|0);
const lvOf=k=>C.lvOf(save.recs[k],entryOf(k));
const met=k=>!!save.recs[k];
// テストの日（保護者用で変えられる。はじめは 2週間後）
function testDay(){if(!save.testDay||C.daysBetween(today(),save.testDay)<0){save.testDay=C.addDays(today(),13);store()}return save.testDay}
const plan=()=>C.todayPlan(save.recs,C.KANJI,today(),testDay());

/* ---------- 音（Web Audio） ---------- */
let actx=null;
function beep(f,d,type,vol,when){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();const t=actx.currentTime+(when||0),o=actx.createOscillator(),g=actx.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol||.07,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d)}catch(e){}}
const sfx={ok:n=>beep(440+Math.min(n||0,12)*40,.09,'square'),no:()=>beep(150,.16,'sawtooth',.05),step:()=>{beep(660,.1,'triangle',.1);beep(990,.16,'triangle',.1,.09)},win:()=>[523,659,784,1047].forEach((f,i)=>beep(f,.18,'triangle',.1,i*.12))};

/* ---------- 共通 ---------- */
function show(id){for(const s of document.querySelectorAll('.screen'))s.classList.toggle('active',s.id===id);if(id==='quest')requestAnimationFrame(fit)}
function banner(text,ms){const b=$('banner');b.textContent=text;b.classList.add('on');clearTimeout(banner.t);banner.t=setTimeout(()=>b.classList.remove('on'),ms||1100)}
function msg(text,type){const m=$('msg');m.textContent=text;m.className='msg'+(type?' '+type:'')}
function anim(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const stars=lv=>'★'.repeat(lv)+'☆'.repeat(C.MAX_LV-lv);
const GUIDE='<path d="M54.5,3V106M3,54.5H106" stroke="#d9d2bd" stroke-width=".5" stroke-dasharray="2 2" fill="none"/>';
const pathOf=(d,color,w,extra)=>`<path d="${d}" fill="none" stroke="${color}" stroke-width="${w||5}" stroke-linecap="round" stroke-linejoin="round"${extra||''}/>`;
const polyD=pts=>'M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join('L');
// 字ぜんたい。color(i) で画ごとの色
function kanjiSvg(k,color,w){const e=entryOf(k);return STROKES[k].map((d,i)=>pathOf(d,color?color(i):COLORS[C.partOf(e,i)],w)).join('')}
// 部品だけを、わくいっぱいに見せる
function pieceSvg(src,from,to,color){const M=C.prep(STROKES[src]),b=C.boxOf(M,from,to,6),s=Math.max(b[2]-b[0],b[3]-b[1]),cx=(b[0]+b[2])/2,cy=(b[1]+b[3])/2;
  return `<svg viewBox="${(cx-s/2).toFixed(1)} ${(cy-s/2).toFixed(1)} ${s.toFixed(1)} ${s.toFixed(1)}">${STROKES[src].slice(from-1,to).map(d=>pathOf(d,color||'#2b2760',s/16)).join('')}</svg>`}

/* ---------- ホーム ---------- */
function renderHome(){
  const P=plan(),list=P.list.slice(0,C.FLOOR_SIZE),left=C.daysBetween(today(),testDay());
  const solid=C.KANJI.filter(e=>met(e.k)&&lvOf(e.k)>=C.MAX_LV).length,seen=C.KANJI.filter(e=>met(e.k)).length;
  $('floorNum').textContent=`${save.floor+1} かい`;
  $('floorText').innerHTML=`テストまで あと <b>${left}</b>日　／　なかま ${seen}/${C.KANJI.length}（★3つ ${solid}）<div class="meter"><i style="width:${100*seen/C.KANJI.length}%"></i><i class="gold" style="width:${100*solid/C.KANJI.length}%"></i></div>`;
  $('todayHead').textContent=P.list.length?`きょうは あと ${P.list.length}体（${Math.ceil(P.list.length/C.FLOOR_SIZE)}かい ぶん）。つぎの かいの まもの：`:'きょうの ぶんは おわり！ また あした のぼろう。';
  $('today').innerHTML=list.map(k=>{const e=entryOf(k),lv=lvOf(k),m=met(k);return `<div class="trow"><div class="em">${e.enemy}</div><div><b>${e.name}</b><small>${m?`「${k}」 ${stars(lv)}`:e.known?'知っている字か たしかめる':'はじめての 漢字'}</small></div><span class="tag ${m?'':'new'}">${m?'ふっかつ':e.known?'たしかめ':'あたらしい'}</span></div>`}).join('');
  $('go').hidden=!list.length;
}
$('go').onclick=()=>{const list=plan().list.slice(0,C.FLOOR_SIZE);if(list.length)startQuest(list)};

/* ---------- れんしゅう（1字＝まもの1体。ステップを1つ終えるたびに こうげき） ---------- */
let Q=null,S=null; // Q: きょうの流れ、S: いまのステップの状態
function startQuest(list){Q={list,qi:0,results:[]};show('quest');startKanji()}
function startKanji(){const k=Q.list[Q.qi];Q.k=k;Q.e=entryOf(k);Q.M=MODELS[k];Q.lv=lvOf(k);Q.first=!met(k);Q.steps=C.stepsFor(Q.lv,Q.e).slice();Q.si=0;Q.result='good';Q.fix=false;
  $('sprite').textContent=Q.e.enemy;$('sprite').className='sprite';$('ename').textContent=Q.e.name;startStep()}
function renderBar(){$('stepLabel').textContent=`${Q.qi+1}/${Q.list.length}体目　${STEP_NAME[Q.steps[Q.si]]||'たおした！'}`;
  $('pips').innerHTML=Q.steps.map((_,i)=>`<i class="${i<Q.si?'off':''}"></i>`).join('')}
function setQuestion(showKanji){const q=Q.e.q.replace(/\[(.+?)\]/,showKanji&&!Q.e.note?`<b>${Q.k}</b>`:'<b>$1</b>');$('question').innerHTML=q+(Q.e.note?`<small style="font-size:15px;color:var(--sub)">　（きいろの ${Q.e.note}${showKanji?`＝「${Q.k}」`:''}）</small>`:'')}
function buttons(list){$('actions').innerHTML='';for(const b of list){const el=document.createElement('button');el.textContent=b.text;el.className=b.cls||'';el.onclick=b.fn;if(b.id)el.dataset.id=b.id;$('actions').appendChild(el)}}
function startStep(){S={type:Q.steps[Q.si]};$('tray').innerHTML='';buttons([]);renderBar();STEP[S.type]()}
function stepDone(text){
  sfx.step();anim($('sprite'),'hit');Q.si++;renderBar();
  if(Q.si<Q.steps.length){banner(text||'ヒット！',800);S.lock=true;return setTimeout(startStep,850)}
  S.lock=true;anim($('sprite'),'dead');sfx.win();
  const before=Q.lv,rec=C.advance(save.recs[Q.k],Q.result,today(),Q.e);save.recs[Q.k]=rec;store();
  setTimeout(()=>{
    $('winTitle').textContent=`${Q.e.enemy} ${Q.e.name}を たおした！`;
    $('winStars').innerHTML=`<span class="kyo">${Q.k}</span> <span style="color:var(--gold)">${stars(rec.lv)}</span>`;
    $('winText').textContent=Q.first&&Q.result==='good'?`「${Q.k}」が なかまに なった！`+(Q.e.parts.length>1?' 部品も 手に入れた。':''):rec.lv>before?`「${Q.k}」が レベルアップ！`:Q.result==='close'?'おしい！ あした もう一度 たたかおう。':rec.lv===before?`「${Q.k}」は もう かんぺき！`:'だいじょうぶ。あした もう一度 いっしょに おぼえよう。';
    $('winChips').innerHTML=Q.first&&Q.e.parts.length>1?Q.e.parts.map((p,i)=>`<span class="chip kyo" style="background:${CHIP[i]}">${p.name}</span>`).join(''):'';
    $('winOv').classList.add('on');
  },750);
}
$('winOk').onclick=()=>{$('winOv').classList.remove('on');
  if(Q.done){Q=null;renderHome();return show('home')}
  if(Q.qi<Q.list.length-1){Q.qi++;return startKanji()}
  save.floor++;store();Q.done=true;const rest=plan().list.length;
  $('winTitle').textContent='🎉 1かい のぼった！';$('winStars').textContent='🗼';$('winText').textContent=`${save.floor+1}かいへ。`+(rest?`きょうは あと ${rest}体。つづけても、ひと休みしても いいよ。`:'きょうの ぶんは ぜんぶ おわり！ たおした字は 日を あけて ふっかつする。');$('winChips').innerHTML='';$('winOv').classList.add('on')};
$('retreat').onclick=()=>{Q=null;renderHome();show('home')};

const stage=$('stage');
function fit(){const b=$('board');if(!b.clientWidth)return;const s=Math.floor(Math.max(160,Math.min(b.clientWidth,b.clientHeight)-8));stage.style.width=stage.style.height=s+'px'}
addEventListener('resize',()=>{fit();setTimeout(fit,300)});
function pt(ev){const r=stage.getBoundingClientRect();return[(ev.clientX-r.left)/r.width*109,(ev.clientY-r.top)/r.height*109]}
const dot=(p,n)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.8" fill="#22b455"/>`+(n?`<text x="${p[0]}" y="${p[1]+1.7}" font-size="4.8" font-weight="700" fill="#fff" text-anchor="middle">${n}</text>`:'');

const STEP={
  /* であう：部品に分けて、書き順を見せる */
  meet(){
    setQuestion(true);msg(Q.e.memo);
    const draw=()=>{stage.innerHTML=GUIDE+STROKES[Q.k].map((d,i)=>`<path d="${d}" fill="none" stroke="${COLORS[C.partOf(Q.e,i)]}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur="0.4s" begin="indefinite" fill="freeze"/></path>`).join('');
      stage.querySelectorAll('animate').forEach((a,i)=>setTimeout(()=>{try{a.beginElement()}catch(e){}},i*450))};
    draw();
    $('tray').innerHTML=Q.e.parts.map((p,i)=>`<span class="chip kyo" style="background:${CHIP[i]};font-size:18px">${p.name}</span>`).join('<b style="align-self:center">＋</b>');
    buttons([{text:'▶ もう一回 見る',cls:'ghost',fn:draw},{text:'おぼえた！ つぎへ',cls:'primary',fn:()=>stepDone('であった！')}]);
  },
  /* どの字？：読みから字をえらぶ（空欄をへらす） */
  pick(){
    setQuestion(false);msg('きいろい ところは、どの漢字？');stage.innerHTML=GUIDE+'<text x="54.5" y="72" font-size="50" text-anchor="middle" fill="#c9c5d8">？</text>';
    const opts=shuffle([Q.k].concat(shuffle(ORDER.filter(k=>k!==Q.k)).slice(0,3)));
    $('tray').innerHTML=opts.map(k=>`<button class="opt kyo" data-k="${k}">${k}</button>`).join('');
    for(const b of $('tray').children)b.onclick=()=>{if(S.lock)return;
      if(b.dataset.k===Q.k){sfx.ok();stage.innerHTML=GUIDE+kanjiSvg(Q.k);setQuestion(true);stepDone('せいかい！')}
      else{sfx.no();b.classList.add('no');b.disabled=true;S.missed=true;msg('ちがうよ。文を 読んで、もう一度 えらぼう。','bad')}};
  },
  /* くみたて：部品をえらんで、正しい場所に置く（にせもの・左右ぎゃく を ふせぐ） */
  build(){
    setQuestion(false);
    S.placed=Q.e.parts.map(()=>false);S.sel=null;S.guide=Q.lv===0;
    S.tiles=shuffle(Q.e.parts.map((p,i)=>({part:i,src:Q.k,from:p.from,to:p.to})).concat((Q.e.decoys||[]).map(d=>({part:-1,src:d.src,from:d.from,to:d.to}))));
    $('tray').innerHTML=S.tiles.map((t,i)=>`<button class="tile" data-i="${i}">${pieceSvg(t.src,t.from,t.to)}</button>`).join('');
    for(const b of $('tray').children)b.onclick=()=>{if(S.lock||b.classList.contains('no'))return;S.sel=+b.dataset.i;for(const x of $('tray').children)x.classList.toggle('sel',x===b);msg('どこに 置く？ わくを タップ。');draw()};
    const draw=()=>{stage.innerHTML=GUIDE+Q.e.parts.map((p,i)=>{const b=C.boxOf(Q.M,p.from,p.to,4);
      return S.placed[i]?STROKES[Q.k].slice(p.from-1,p.to).map(d=>pathOf(d,COLORS[i],5)).join(''):`<rect class="slot ${S.sel!=null?'hot':''}" data-slot="${i}" x="${b[0]}" y="${b[1]}" width="${b[2]-b[0]}" height="${b[3]-b[1]}" rx="4"/>`}).join('')+(S.guide?Q.e.parts.map((p,i)=>S.placed[i]?'':STROKES[Q.k].slice(p.from-1,p.to).map(d=>pathOf(d,'#bdb6a2',5,' opacity=".7"')).join('')).join(''):'')};
    S.draw=draw;draw();
    msg(S.guide?'部品を えらんで、うすい お手本の 場所に 置こう。にせものに 注意！':'部品を えらんで、正しい 場所に 置こう。左と 右、上と 下を よく 思い出して。');
    S.tap=p=>{
      if(S.sel==null)return msg('先に、下の 部品を えらぼう。');
      // タップした場所が入っている わく（重なるときは 中心が近いほう）
      let slot=-1,bd=1e9;Q.e.parts.forEach((q,i)=>{if(S.placed[i])return;const b=C.boxOf(Q.M,q.from,q.to,4);if(p[0]<b[0]||p[0]>b[2]||p[1]<b[1]||p[1]>b[3])return;let d=1e9;for(let n=q.from-1;n<q.to;n++)d=Math.min(d,C.distToStroke(p,Q.M[n]));if(d<bd){bd=d;slot=i}});
      if(slot<0)return;
      const t=S.tiles[S.sel],btn=$('tray').children[S.sel];
      if(t.part===slot){sfx.ok();S.placed[slot]=true;btn.classList.add('used');btn.classList.remove('sel');S.sel=null;draw();
        if(S.placed.every(Boolean)){msg(`「${Q.k}」が できた！`,'good');return stepDone('くみたて せいこう！')}
        return msg(`「${Q.e.parts[slot].name}」は そこ！ のこりも 置こう。`,'good')}
      sfx.no();anim(stage,'shake');S.missed=true;btn.classList.remove('sel');S.sel=null;
      if(t.part<0){btn.classList.add('no');msg('にているけど、ちがう 部品だよ。形を よく 見くらべよう。','bad')}
      else msg(`部品は 合ってる！ でも 場所が ちがうよ。「${Q.e.parts[t.part].name}」は どっちがわ？`,'bad');
      draw();
    };
  },
  /* 書きじゅん：つぎに書く画を タップ（字の きれいさと 関係なく 確かめる） */
  order(){
    setQuestion(true);S.pos=0;S.miss=0;
    const draw=flash=>{stage.innerHTML=GUIDE+STROKES[Q.k].map((d,i)=>pathOf(d,i<S.pos?COLORS[C.partOf(Q.e,i)]:i===flash?'#ff4d6d':i===S.pos&&S.miss>=2?'#ff9f1c':'#c9c5d8',5.5)).join('')+Q.M.slice(0,S.pos).map((m,i)=>dot(m[0],i+1)).join('')};
    draw();msg('1画目から じゅんばんに、画を タップしよう。');
    S.tap=p=>{
      const j=C.pickStroke(Q.M,S.pos,p);if(j<0)return;
      if(j===S.pos){sfx.ok(S.pos);S.pos++;S.miss=0;draw();
        if(S.pos>=Q.M.length)return stepDone('書きじゅん かんぺき！');
        return msg(`${S.pos}画目 OK！ つぎは ${S.pos+1}画目。`,'good')}
      sfx.no();S.miss++;draw(j);setTimeout(()=>{if(S.type==='order'&&!S.lock)draw()},350);
      msg(`それは ${j+1}画目。いまは ${S.pos+1}画目だよ。`+(S.miss>=2?' オレンジの 画を タップ。':''),'bad');
    };
  },
  /* なぞる：ゆるい判定。当たった画は きれいな線に 置きかわる */
  trace(){
    setQuestion(true);S.pos=0;S.miss=0;S.live=null;S.model=Q.lv===0||Q.fix;
    const draw=()=>{const m=Q.M[S.pos];stage.innerHTML=GUIDE+(S.model?STROKES[Q.k].slice(S.pos).map(d=>pathOf(d,'#d6d0bf',5.5)).join(''):'')
      +STROKES[Q.k].slice(0,S.pos).map((d,i)=>pathOf(d,COLORS[C.partOf(Q.e,i)],5.5)).join('')
      +(m&&S.miss>=1?pathOf(STROKES[Q.k][S.pos],'#ff9f1c',5.5,' opacity=".6"'):'')+(m?dot(m[0],S.model||S.miss>=1?S.pos+1:0):'')
      +(S.live?pathOf(polyD(S.live),'#4a3fd1',5):'')};
    S.draw=draw;draw();
    msg(S.model?'うすい お手本を、緑の 丸から じゅんばんに なぞろう。':'緑の 丸が 書き始め。形を 思い出して 書こう。まよったら オレンジの 線が 出るよ。');
    S.stroke=user=>{
      const r=C.judgeTrace(user,Q.M,S.pos);
      const next=auto=>{if(!auto)sfx.ok(S.pos);S.pos++;S.miss=0;draw();if(S.pos>=Q.M.length)return stepDone('なぞれた！');if(!auto)msg(['いいね！','そのちょうし！','ナイス！'][S.pos%3],'good')};
      if(r.ok)return next(false);
      sfx.no();S.miss++;S.missed=true;
      const why={order:`それは ${r.at+1}画目。いまは ${S.pos+1}画目だよ。`,reverse:'むきが ぎゃくだよ。緑の 丸から 書こう。',start:'書き始めの 場所が ちがうよ。緑の 丸から。',short:'さいごまで しっかり 書こう。'}[r.reason]||'オレンジの 線の とおりに 書こう。';
      if(S.miss>=C.TRACE_AUTO){msg(`${S.pos+1}画目は こう書くよ。つぎへ 進もう。`);return next(true)}
      msg(`${S.pos+1}画目：${why}`,'bad');draw();
    };
  },
  /* 思い出して書く：読みだけ見て自由に書き、お手本と重ねて自分で見くらべる */
  recall(){
    setQuestion(false);S.ink=[];S.live=null;S.shown=false;S.hint=0;
    const draw=()=>{stage.innerHTML=GUIDE+(S.shown?kanjiSvg(Q.k,()=>'#ff4d6d',5).replace(/<path /g,'<path opacity=".45" '):'')+S.ink.map(s=>pathOf(polyD(s),'#2b2760',4.5)).join('')+(S.live?pathOf(polyD(S.live),'#4a3fd1',4.5):'')};
    S.draw=draw;draw();
    msg('お手本なし！ きいろい ところの 漢字を、思い出して 書こう。');
    const writing=()=>buttons([{text:'↩ 一画 もどす',cls:'ghost',fn:()=>{S.ink.pop();draw()}},{text:'ぜんぶ 消す',cls:'ghost',fn:()=>{S.ink=[];draw()}},
      {text:'💡 部品ヒント',cls:'ghost',fn:()=>{S.hint=1;msg('部品は 「'+Q.e.parts.map(p=>p.name).join('」＋「')+'」。'+Q.e.memo)}},
      {text:'書けた！ くらべる',cls:'primary',fn:reveal}]);
    const reveal=()=>{S.shown=true;S.live=null;draw();setQuestion(true);
      msg('赤い お手本と くらべよう。部品の 形と 場所は 同じ？');
      buttons([{text:'⭕ 同じに 書けた',cls:'primary',id:'good',fn:()=>judge('good')},{text:'🔺 すこし ちがった',id:'close',fn:()=>judge('close')},{text:'❌ 思い出せなかった',id:'forgot',fn:()=>judge('forgot')}]);
      if(!S.ink.length)$('actions').firstChild.disabled=true};
    const judge=r=>{if(S.lock)return;const res=r==='good'&&S.hint?'close':r;Q.result=res;
      save.ink[Q.k]={s:S.ink.map(s=>ST.resample(s,Math.min(24,Math.max(2,s.length))).map(p=>[Math.round(p[0]),Math.round(p[1])])),r:res,d:today()};store();
      if(res==='good')return stepDone('会心の いちげき！');
      // ちがったときは、正しい形を なぞってから 終わる
      Q.steps.push('trace');Q.fix=true;S.lock=true;banner('正しい形を なぞって おぼえよう',1000);Q.si++;setTimeout(startStep,1000)};
    writing();
    S.free=true;
  },
};

/* ---------- タッチ ---------- */
let pid=null;
stage.addEventListener('pointerdown',ev=>{if(!Q||!S||S.lock||pid!==null)return;ev.preventDefault();const p=pt(ev);
  if(S.tap)return S.tap(p);
  if(!S.draw||S.shown)return;pid=ev.pointerId;try{stage.setPointerCapture(pid)}catch(e){}S.live=[p];S.draw()});
stage.addEventListener('pointermove',ev=>{if(ev.pointerId!==pid||!S||!S.live)return;ev.preventDefault();S.live.push(pt(ev));S.draw()});
function up(ev){if(ev.pointerId!==pid)return;pid=null;if(!S||!S.live)return;const user=S.live;S.live=null;
  if(S.free){if(user.length>1)S.ink.push(user);else S.ink.push([user[0],[user[0][0]+.6,user[0][1]+.6]]);return S.draw()}
  if(user.length<2||ST.polyLength(user)<2)return S.draw();
  S.stroke(user)}
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
document.addEventListener('touchmove',ev=>{if($('quest').classList.contains('active')&&ev.cancelable)ev.preventDefault()},{passive:false});
document.addEventListener('gesturestart',ev=>ev.preventDefault());

/* ---------- ずかん ---------- */
$('openBook').onclick=()=>{
  $('bookGrid').innerHTML=C.KANJI.map(e=>{const lv=lvOf(e.k);return met(e.k)?`<div class="kcard"><svg viewBox="0 0 109 109">${kanjiSvg(e.k,null,5)}</svg><div class="stars">${stars(lv)}</div><small>${e.enemy} ${e.name}</small></div>`
    :`<div class="kcard locked"><svg viewBox="0 0 109 109"><text x="54.5" y="72" font-size="50" text-anchor="middle" fill="#6a63c4">？</text></svg><small>まだ 出会っていない</small></div>`}).join('');
  const parts=[...new Set(C.KANJI.filter(e=>met(e.k)&&e.parts.length>1).flatMap(e=>e.parts.map(p=>p.name)).filter(n=>!n.includes('の 部品')))].map((n,i)=>`<span class="chip kyo" style="background:${CHIP[i%3]}">${n}</span>`);
  $('bookParts').innerHTML=parts.join('')||'<span style="color:var(--sub)">まだ ないよ</span>';
  $('bookOv').classList.add('on')};
$('bookClose').onclick=()=>$('bookOv').classList.remove('on');

/* ---------- 保護者用 ---------- */
function renderParent(){
  const R={good:'⭕ 同じに書けた',close:'🔺 すこしちがった',forgot:'❌ 思い出せなかった'};
  $('parentGrid').innerHTML=C.KANJI.map(e=>{const k=save.ink[e.k],rec=save.recs[e.k];
    return `<div class="kcard"><svg viewBox="0 0 109 109">${kanjiSvg(e.k,()=>'#ffb3c0',4)}${k?k.s.map(s=>pathOf(polyD(s),'#1b1838',3.5)).join(''):''}</svg><small>${rec?`段 ${rec.lv}/${C.MAX_LV}　つぎは ${String(rec.next).slice(4,6)}/${String(rec.next).slice(6)}`:'まだ'}<br>${k?R[k.r]:'（思い出して書く は まだ）'}</small></div>`}).join('');
  const t=String(today()),td=String(testDay()),P=plan();$('parentDay').textContent=`塔の中の きょう：${t.slice(4,6)}/${t.slice(6)}`+(save.dayOffset?`（試用で ${save.dayOffset}日 進めています）`:'')+`　きょうの のこり：復習 ${P.due.length}・新しい字 ${P.fresh.length}・たしかめ ${P.check.length}`;
  $('testDate').value=`${td.slice(0,4)}-${td.slice(4,6)}-${td.slice(6)}`;
}
$('openParent').onclick=()=>{renderParent();$('parentOv').classList.add('on')};
$('parentClose').onclick=()=>{$('parentOv').classList.remove('on');renderHome()};
$('testDate').onchange=()=>{const v=$('testDate').value.replace(/-/g,'');if(/^\d{8}$/.test(v)&&C.daysBetween(today(),+v)>=0){save.testDay=+v;store()}renderParent()};
$('skipDay').onclick=()=>{save.dayOffset=(save.dayOffset|0)+1;store();renderParent()};
$('resetAll').onclick=()=>{if(confirm('試作の 記録を 消して、さいしょから はじめますか？')){save=blank();store();renderParent()}};

renderHome();
</script>
